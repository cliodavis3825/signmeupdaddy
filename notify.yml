# Delivers queued emails (confirmations, waitlist promotions, day-before reminders) every 15 minutes.
# Repo secrets: SUPABASE_URL, CRON_SECRET (same value as the Edge Function secret).
name: notify
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, off the top of the hour when GitHub queues are busiest
  workflow_dispatch:
concurrency: notify
jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Drain outbox
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then echo "Secrets not set yet; skipping."; exit 0; fi
          curl -fsS --max-time 60 -X POST "$URL/functions/v1/send-outbox" -H "x-cron-secret: $SECRET" | tee -a "$GITHUB_STEP_SUMMARY"
