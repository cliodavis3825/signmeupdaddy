# Per-function settings used by `supabase functions deploy`.
# ical is fetched by calendar apps (no auth header); send-outbox checks its own CRON_SECRET.
[functions.ical]
verify_jwt = false

[functions.send-outbox]
verify_jwt = false

[functions.signup]
verify_jwt = true

[functions.club-request]
verify_jwt = true

[functions.subscribe]
verify_jwt = true

[functions.post-comment]
verify_jwt = true

[functions.notify]
verify_jwt = true
